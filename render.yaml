# Render configuration for PhenotypeLibrary MCP Server
services:
  - type: web
    name: phenotypelibrary-mcp
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -e .
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: MCP_ALLOWED_HOSTS
        value: phenotypelibrarymcp.onrender.com
      - key: PHENOTYPELIBRARY_BASE_URL
        value: https://conceptlibrary.saildatabank.com/api/v1/
      - key: PHENOTYPELIBRARY_TIMEOUT
        value: "30.0"
    healthCheckPath: /health
    autoDeploy: true